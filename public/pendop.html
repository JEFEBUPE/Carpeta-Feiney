// ─── VOZ ─────────────────────────────────────────────────────────────────────
function parseVoiceText(text) {
  const t = text.toLowerCase();
  const result = {};
  if (/\balta\b/.test(t)) result.prioridad = "Alta";
  else if (/\bbaja\b/.test(t)) result.prioridad = "Baja";
  else result.prioridad = "Media";
  const areaMap = {
    "cpf":"CPF","cargadero":"Cargadero","cluster":"Clusters","clusters":"Clusters",
    "pozos":"Pozos","pozo":"Pozos","hse":"HSE","mantenimiento":"Mantenimiento",
    "producción":"Producción","produccion":"Producción","scada":"SCADA",
    "instrumentación":"Instrumentación","instrumentacion":"Instrumentación"
  };
  for (const [key,val] of Object.entries(areaMap)) {
    if (t.includes(key)) { result.area = val; break; }
  }
  const now = new Date();
  if (/pasado mañana|pasado manana/.test(t)) {
    const d = new Date(now); d.setDate(d.getDate()+2); d.setHours(8,0,0,0);
    result.fechaCompromiso = d.toISOString().slice(0,16);
  } else if (/mañana|manana/.test(t)) {
    const d = new Date(now); d.setDate(d.getDate()+1); d.setHours(8,0,0,0);
    result.fechaCompromiso = d.toISOString().slice(0,16);
  } else if (/\bhoy\b/.test(t)) {
    const d = new Date(now); d.setHours(18,0,0,0);
    result.fechaCompromiso = d.toISOString().slice(0,16);
  }
  const respMatch = text.match(/(?:responsable|encargado)[:\s]+([A-ZÁÉÍÓÚÑa-záéíóúñ\s]{3,30}?)(?:\s*,|\s*\.|$)/i);
  if (respMatch) result.responsable = respMatch[1].trim();
  const equipoMatch = text.match(/(?:equipo|sistema|válvula|valvula|sensor|transmisor|bomba|compresor)[:\s]+([A-Za-z0-9\-]{3,20})/i)
    || text.match(/\b([A-Z]{2,5}-[A-Z0-9]{2,10})\b/);
  if (equipoMatch) result.equipo = equipoMatch[1];
  result.nombre = text.length > 80 ? text.slice(0,80) : text;
  result.descripcion = text;
  return result;
}

function VoiceButton({ onFill }) {
  const [listening, setListening] = useState(false);
  const [transcript, setTranscript] = useState("");
  const [supported] = useState(() => !!(window.SpeechRecognition || window.webkitSpeechRecognition));
  const recRef = React.useRef(null);
  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    const rec = new SR();
    rec.lang = "es-CO";
    rec.continuous = false;
    rec.interimResults = false;
    rec.onresult = e => {
      const text = e.results[0][0].transcript;
      setTranscript(text);
      onFill(parseVoiceText(text));
    };
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recRef.current = rec;
  }, []);
  const toggle = () => {
    if (!recRef.current) return;
    if (listening) { recRef.current.stop(); }
    else { setTranscript(""); recRef.current.start(); setListening(true); }
  };
  if (!supported) return null;
  return (
    <div style={{ marginBottom:18 }}>
      <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}`}</style>
      <button onClick={toggle} style={{
        width:"100%", background: listening ? COLORS.red+"18" : COLORS.accent+"18",
        border:`2px solid ${listening ? COLORS.red : COLORS.accent}`,
        borderRadius:12, padding:"14px 16px", cursor:"pointer", fontFamily:"inherit",
        display:"flex", alignItems:"center", gap:12
      }}>
        <span style={{ fontSize:28 }}>{listening ? "⏹️" : "🎙️"}</span>
        <div style={{ textAlign:"left", flex:1 }}>
          <div style={{ color: listening ? COLORS.red : COLORS.accent, fontWeight:800, fontSize:14 }}>
            {listening ? "Grabando… toca para detener" : "Dictar actividad por voz"}
          </div>
          <div style={{ color:COLORS.textMuted, fontSize:11, marginTop:2 }}>
            {listening ? "Di el nombre, área, responsable y fecha" : "Rellena el formulario hablando"}
          </div>
        </div>
        {listening && <span style={{ width:12, height:12, borderRadius:"50%", background:COLORS.red, display:"inline-block", animation:"pulse 1s infinite" }} />}
      </button>
      {transcript && (
        <div style={{ marginTop:8, padding:"10px 12px", background:COLORS.surfaceAlt, borderRadius:8, fontSize:12, color:COLORS.textMuted, lineHeight:1.5 }}>
          <span style={{ color:COLORS.accent, fontWeight:700 }}>Transcripción: </span>{transcript}
        </div>
      )}
    </div>
  );
}

            <div style={{ display:"flex", alignItems:"center", flexWrap:"wrap", gap:6, marginBottom:4 }}>
              <Dot color={c.dot} />
              <span style={{ color:COLORS.text, fontSize:14, fontWeight:700 }}>{item.nombre}</span>
            </div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
              <Badge color={item.prioridad==="Alta"?COLORS.red:item.prioridad==="Media"?COLORS.yellow:COLORS.gray}>{item.prioridad}</Badge>
              <Badge color={COLORS.accent}>{item.area}</Badge>
              <Badge color={item.estado==="Cerrado"?COLORS.gray:item.estado==="Vencido"?COLORS.red:COLORS.green}>{item.estado}</Badge>
            </div>
          </div>
          <span style={{ color:COLORS.textMuted, fontSize:18 }}>{expand?"▲":"▼"}</span>
        </div>
        <div style={{ display:"flex", gap:12, marginTop:8, fontSize:12, color:COLORS.textMuted }}>
          <span>👤 {item.responsable}</span>
          <span>📅 {formatDate(item.fechaCompromiso)}</span>
          {item.equipo && <span>⚙️ {item.equipo}</span>}
        </div>
      </div>
      {expand && (
        <div style={{ borderTop:`1px solid ${COLORS.border}`, padding:"12px 14px" }}>
          {item.descripcion && <p style={{ margin:"0 0 8px", fontSize:13, color:COLORS.textMuted }}>{item.descripcion}</p>}
          {item.observaciones && <p style={{ margin:"0 0 12px", fontSize:12, color:COLORS.textDim, fontStyle:"italic" }}>📝 {item.observaciones}</p>}
          {item.estado === "Cerrado" && (
            <div style={{ background:COLORS.greenSoft, borderRadius:8, padding:"8px 12px", marginBottom:10, fontSize:12, color:COLORS.green }}>
              ✅ Cerrado: {formatDateTime(item.fechaCierre)} — {item.comentarioCierre || "Sin comentario"}
            </div>
          )}
          {item.estado !== "Cerrado" && (
            <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
              <Btn small variant="success" onClick={()=>onCerrar(item.id)}>✅ Cerrar</Btn>
              <Btn small variant="ghost" onClick={()=>onPosponer(item.id)}>⏱ Posponer</Btn>
              <Btn small variant="ghost" onClick={()=>onEditar(item)}>✏️ Editar</Btn>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── PANEL DASHBOARD ─────────────────────────────────────────────────────────
function Dashboard({ items, onNew }) {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const manana = new Date(hoy); manana.setDate(manana.getDate()+1);
  const vencidos = items.filter(i=>i.estado==="Vencido"||(i.estado!=="Cerrado"&&new Date(i.fechaCompromiso)<new Date()));
  const hoyItems = items.filter(i=>{ const d=new Date(i.fechaCompromiso); return d>=hoy&&d<manana&&i.estado!=="Cerrado"; });
  const criticos = items.filter(i=>i.prioridad==="Alta"&&i.estado!=="Cerrado");
  const cerradosHoy = items.filter(i=>{ if(!i.fechaCierre)return false; const d=new Date(i.fechaCierre); return d>=hoy&&d<manana; });

  const StatCard = ({label,value,color,icon})=>(
    <div style={{ background:color+"18", border:`1px solid ${color}33`, borderRadius:12, padding:"14px", textAlign:"center" }}>
      <div style={{ fontSize:26, marginBottom:4 }}>{icon}</div>
      <div style={{ fontSize:28, fontWeight:900, color, fontFamily:"monospace" }}>{value}</div>
      <div style={{ fontSize:11, color:COLORS.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", marginTop:2 }}>{label}</div>
    </div>
  );

  return (
    <div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:18 }}>
        <StatCard label="Pendientes Hoy" value={hoyItems.length} color={COLORS.yellow} icon="📋" />
        <StatCard label="Vencidos" value={vencidos.length} color={COLORS.red} icon="🔴" />
        <StatCard label="Críticos" value={criticos.length} color={COLORS.accent} icon="⚠️" />
        <StatCard label="Cerrados Hoy" value={cerradosHoy.length} color={COLORS.green} icon="✅" />
      </div>
      <button onClick={onNew} style={{
        width:"100%", background:COLORS.accent, border:"none", borderRadius:12,
        padding:"15px", fontSize:15, fontWeight:900, color:"#000",
        cursor:"pointer", letterSpacing:"0.05em", marginBottom:18
      }}>＋ NUEVO PENDIENTE</button>
    </div>
  );
}

// ─── REPORTE EJECUTIVO PDF ───────────────────────────────────────────────────
function generarReporteEjecutivo(items) {
  const now = new Date();
  const abiertos  = items.filter(i => i.estado !== "Cerrado");
  const vencidos  = items.filter(i => i.estado === "Vencido" || (i.estado !== "Cerrado" && new Date(i.fechaCompromiso) < now));
  const enProceso = items.filter(i => i.estado === "En Proceso");
  const pendientes= items.filter(i => i.estado === "Pendiente");
  const cerrados  = items.filter(i => i.estado === "Cerrado");
  const criticos  = items.filter(i => i.prioridad === "Alta" && i.estado !== "Cerrado");
  const pctTotal  = items.length ? Math.round(cerrados.length / items.length * 100) : 0;

  const byArea = {};
  items.forEach(i => { if (!byArea[i.area]) byArea[i.area] = []; byArea[i.area].push(i); });
  const byResp = {};
  items.forEach(i => { if (!byResp[i.responsable]) byResp[i.responsable] = []; byResp[i.responsable].push(i); });

  const sorted = [...items].sort((a, b) => {
    const os = { Vencido:0, "En Proceso":1, Pendiente:2, Cerrado:3 };
    const op = { Alta:0, Media:1, Baja:2 };
    if (os[a.estado] !== os[b.estado]) return os[a.estado] - os[b.estado];
    if (op[a.prioridad] !== op[b.prioridad]) return op[a.prioridad] - op[b.prioridad];
    return new Date(a.fechaCompromiso) - new Date(b.fechaCompromiso);
  });

  const dateStr = now.toLocaleDateString("es-CO", {weekday:"long", day:"2-digit", month:"long", year:"numeric"});
  const timeStr = now.toLocaleTimeString("es-CO", {hour:"2-digit", minute:"2-digit"});

  const fdt = d => d ? new Date(d).toLocaleString("es-CO",{day:"2-digit",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
  const fd  = d => d ? new Date(d).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"2-digit"}) : "—";

  const sBadge = e => {
    const c = {Vencido:"#c53030","En Proceso":"#2b6cb0",Pendiente:"#b7791f",Cerrado:"#276749"}[e]||"#4a5568";
    const bg= {Vencido:"#fff5f5","En Proceso":"#ebf8ff",Pendiente:"#fffff0",Cerrado:"#f0fff4"}[e]||"#f7fafc";
    return `<span style="background:${bg};color:${c};border:1px solid ${c}55;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;white-space:nowrap">${e}</span>`;
  };
  const pBadge = p => {
    const c = {Alta:"#c53030",Media:"#b7791f",Baja:"#4a5568"}[p]||"#4a5568";
    const bg= {Alta:"#fff5f5",Media:"#fffff0",Baja:"#f7fafc"}[p]||"#f7fafc";
    return `<span style="background:${bg};color:${c};border:1px solid ${c}55;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700">${p}</span>`;
  };
  const barHtml = (pct, color) =>
    `<div style="background:#e2e8f0;border-radius:3px;height:9px;width:100%"><div style="background:${color};height:9px;border-radius:3px;width:${pct}%"></div></div>`;
  const kpiColor = pct => pct >= 80 ? "#276749" : pct >= 50 ? "#b7791f" : "#c53030";

  const alertasHTML = vencidos.length === 0 ? "" : `
  <div class="section">
    <div class="sec-title red-title">&#128680; Alertas — Actividades Vencidas y Críticas (${vencidos.length})</div>
    ${vencidos.map(i => `
    <div class="alert-box">
      <div class="alert-name">${i.nombre}${i.prioridad==="Alta"?` <span class="badge-alta">&#9888; ALTA</span>`:""}</div>
      <div class="alert-meta">
        <span>&#9881; ${i.equipo||"—"}</span><span>&#128205; ${i.area}</span>

  const actividadesHTML = `

      <tbody>

          const pa=a[1].length?a[1].filter(i=>i.estado==="Cerrado").length/a[1].length:0;
          const pb=b[1].length?b[1].filter(i=>i.estado==="Cerrado").length/b[1].length:0;

      <div class="stat" style="border-color:#2b6cb055">
        <div class="stat-val" style="color:#2b6cb0">${enProceso.length}</div>
        <div class="stat-lbl">En Proceso</div>
      </div>
      <div class="stat" style="border-color:#b7791f55">
        <div class="stat-val" style="color:#b7791f">${pendientes.length}</div>
        <div class="stat-lbl">Pendientes</div>
      </div>
    </div>
    ${["Alta","Media","Baja"].map(p => {
      const tot = items.filter(i => i.prioridad === p);
      const don = tot.filter(i => i.estado === "Cerrado");
      const pct = tot.length ? Math.round(don.length / tot.length * 100) : 0;
      const col = p === "Alta" ? "#c53030" : p === "Media" ? "#b7791f" : "#718096";
      return `<div class="bar-row">
        <div class="bar-lbl" style="color:${col}">${p} Prioridad</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
        <div class="bar-pct">${pct}%</div>
        <div class="bar-detail">${don.length}/${tot.length} cerradas</div>
      </div>`;
    }).join("")}
  </div>

  ${alertasHTML}
  ${actividadesHTML}
  ${areaHTML}
  ${respHTML}
  ${cierresHTML}

  <div class="footer">
    <div>Reporte generado el ${dateStr} a las ${timeStr} &nbsp;•&nbsp; PENDOP – Sistema de Pendientes Operativos Campo Pendare</div>
    <div style="margin-top:3px">Documento de uso interno &nbsp;•&nbsp; Área Operativa</div>
  </div>

</div>
</body>
</html>`;

  const w = window.open("", "_blank");
  if (w) { w.document.write(html); w.document.close(); setTimeout(() => w.print(), 900); }
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App() {
  const [items, setItems] = useState(() => {
    try {
      const saved = localStorage.getItem("pendop_items");
      return saved ? JSON.parse(saved) : SAMPLE;
    } catch { return SAMPLE; }
  });
  const [syncStatus, setSyncStatus] = useState('connecting');
  const [tab, setTab] = useState("dashboard");
  const [filtroArea, setFiltroArea] = useState("");
  const [filtroResp, setFiltroResp] = useState("");
  const [filtroPrioridad, setFiltroPrioridad] = useState("");
  const [filtroEstado, setFiltroEstado] = useState("");
  const [search, setSearch] = useState("");
  const [modalNuevo, setModalNuevo] = useState(false);
  const [modalEditar, setModalEditar] = useState(null);
  const [modalCerrar, setModalCerrar] = useState(null);
  const [modalPosponer, setModalPosponer] = useState(null);
  const [nextId, setNextId] = useState(() => {
    try {
      const saved = localStorage.getItem("pendop_items");
      if (saved) { const arr = JSON.parse(saved); return Math.max(...arr.map(i=>i.id), 9) + 1; }
    } catch {}
    return 10;
  });
  const [notif, setNotif] = useState(null);

  // Persist to localStorage
  useEffect(() => {
    try { localStorage.setItem("pendop_items", JSON.stringify(items)); } catch {}
  }, [items]);

  // Supabase: carga inicial + suscripción en tiempo real
  useEffect(() => {
    let channel;
    async function loadData() {
      setSyncStatus('connecting');
      try {
        const { data, error } = await db.from('pendientes').select('*');
        if (error) throw error;
        if (data && data.length > 0) {
          const mapped = data.map(fromDb);
          setItems(mapped);
          setNextId(Math.max(...mapped.map(i => i.id), 9) + 1);
        } else {
          const initial = (() => {
            try { const s = localStorage.getItem("pendop_items"); return s ? JSON.parse(s) : SAMPLE; } catch { return SAMPLE; }
          })();
          const { error: seedErr } = await db.from('pendientes').upsert(initial.map(toDb));
          if (seedErr) throw seedErr;
        }
        setSyncStatus('live');
      } catch (e) {
        console.warn('Supabase no disponible, usando datos locales:', e.message);
        setSyncStatus('offline');
      }
    }
    function subscribe() {
      channel = db.channel('pendientes-rt')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'pendientes' }, payload => {
          if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
            const item = fromDb(payload.new);
            setItems(prev => {
              const idx = prev.findIndex(i => i.id === item.id);
              if (idx >= 0) { const next = [...prev]; next[idx] = item; return next; }
              return [...prev, item];
            });
          } else if (payload.eventType === 'DELETE') {
            setItems(prev => prev.filter(i => i.id !== payload.old.id));
          }
        })
        .subscribe(status => {
          if (status === 'SUBSCRIBED') setSyncStatus('live');
          else if (status === 'CHANNEL_ERROR') setSyncStatus('offline');
        });
    }
    loadData().then(() => subscribe());
    return () => { if (channel) db.removeChannel(channel); };
  }, []);

  // Verificar vencimientos
  useEffect(()=>{
    const t = setInterval(()=>{
      setItems(prev=>prev.map(i=>{
        if(i.estado==="Cerrado"||i.estado==="Vencido") return i;
        if(new Date(i.fechaCompromiso)<new Date()) return {...i,estado:"Vencido"};
        return i;
      }));
    }, 30000);
    return ()=>clearInterval(t);
  },[]);

  const showNotif = (msg,color=COLORS.green) => {
    setNotif({msg,color});
    setTimeout(()=>setNotif(null),3000);
  };

  const guardarNuevo = async (f) => {
    const item = {...f, id:nextId, fechaCierre:null, comentarioCierre:""};
    setItems(p=>[...p, item]);
    setNextId(p=>p+1);
    setModalNuevo(false);
    showNotif("✅ Pendiente registrado correctamente");
    try { await db.from('pendientes').insert(toDb(item)); }
    catch(e) { console.warn('Error al guardar:', e.message); setSyncStatus('offline'); }
  };

  const guardarEditar = async (f) => {
    const updated = {...modalEditar, ...f};
    setItems(p=>p.map(i=>i.id===modalEditar.id ? updated : i));
    setModalEditar(null);
    showNotif("✅ Pendiente actualizado");
    try { await db.from('pendientes').update(toDb(updated)).eq('id', updated.id); }
    catch(e) { console.warn('Error al actualizar:', e.message); setSyncStatus('offline'); }
  };

  const cerrarItem = async (id, comentario) => {
    const item = items.find(i=>i.id===id);
    const updated = {...item, estado:"Cerrado", fechaCierre:new Date().toISOString(), comentarioCierre:comentario};
    setItems(p=>p.map(i=>i.id===id ? updated : i));
    setModalCerrar(null);
    showNotif("✅ Actividad cerrada correctamente", COLORS.green);
    try { await db.from('pendientes').update(toDb(updated)).eq('id', id); }
    catch(e) { console.warn('Error al cerrar:', e.message); setSyncStatus('offline'); }
  };

  const posponerItem = async (id, ms) => {
    if(ms<=0){setModalPosponer(null);return;}
    const item = items.find(i=>i.id===id);
    const nuevaFecha = new Date(new Date(item.fechaCompromiso).getTime()+ms).toISOString();
    const updated = {...item, fechaCompromiso:nuevaFecha, estado:"Pendiente"};
    setItems(p=>p.map(i=>i.id===id ? updated : i));
    setModalPosponer(null);
    showNotif("⏱ Recordatorio pospuesto", COLORS.yellow);
    try { await db.from('pendientes').update(toDb(updated)).eq('id', id); }
    catch(e) { console.warn('Error al posponer:', e.message); setSyncStatus('offline'); }
  };

  const filtered = items.filter(i=>{
    if(filtroArea && i.area!==filtroArea) return false;
    if(filtroResp && !i.responsable.toLowerCase().includes(filtroResp.toLowerCase())) return false;
    if(filtroPrioridad && i.prioridad!==filtroPrioridad) return false;
    if(filtroEstado && i.estado!==filtroEstado) return false;
    if(search && !i.nombre.toLowerCase().includes(search.toLowerCase()) && !i.equipo?.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const respList = [...new Set(items.map(i=>i.responsable))];

  const navTabs = [
    {k:"dashboard",icon:"🏠",label:"Inicio"},
    {k:"lista",icon:"📋",label:"Lista"},
    {k:"reportes",icon:"📊",label:"Reportes"},
  ];

  return (
    <div style={{ fontFamily:"'Segoe UI', system-ui, sans-serif", background:COLORS.bg, color:COLORS.text, minHeight:"100vh", maxWidth:480, margin:"0 auto", position:"relative" }}>

      {/* HEADER */}
      <div style={{
        background: `linear-gradient(135deg, ${COLORS.surface} 0%, #1a2035 100%)`,
        borderBottom:`2px solid ${COLORS.accent}22`,
        padding:"14px 16px 10px", position:"sticky", top:0, zIndex:100
      }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:20 }}>🛢️</span>
              <span style={{ fontWeight:900, fontSize:16, color:COLORS.accent, letterSpacing:"0.05em" }}>PENDOP</span>
              <span style={{ fontSize:11, color:COLORS.textMuted, background:COLORS.surfaceAlt, padding:"2px 8px", borderRadius:10 }}>Campo Pendare</span>
            </div>
            <div style={{ fontSize:11, color:COLORS.textDim, marginTop:2 }}>
              {new Date().toLocaleDateString("es-CO",{weekday:"long",day:"2-digit",month:"long"})}
            </div>
          </div>
          <div style={{ textAlign:"right" }}>
            <div style={{ fontSize:11, color:COLORS.textMuted }}>Pendientes</div>
            <div style={{ fontWeight:900, fontSize:22, color:items.filter(i=>i.estado!=="Cerrado").length>0?COLORS.accent:COLORS.green, fontFamily:"monospace" }}>
              {items.filter(i=>i.estado!=="Cerrado").length}
            </div>
            <div style={{ fontSize:10, marginTop:3, display:"flex", alignItems:"center", gap:4, justifyContent:"flex-end" }}>
              <span style={{ width:6, height:6, borderRadius:"50%", display:"inline-block",
                background: syncStatus==='live' ? COLORS.green : syncStatus==='connecting' ? COLORS.yellow : COLORS.red }} />
              <span style={{ color: syncStatus==='live' ? COLORS.green : syncStatus==='connecting' ? COLORS.yellow : COLORS.red }}>
                {syncStatus==='live' ? 'En vivo' : syncStatus==='connecting' ? 'Conectando…' : 'Sin conexión'}
              </span>
            </div>
          </div>
        </div>
      </div>

      {/* NOTIFICACION */}
      {notif && (
        <div style={{
          position:"fixed",top:70,left:"50%",transform:"translateX(-50%)",
          background:notif.color,color:"#fff",borderRadius:10,padding:"10px 20px",
          fontSize:13,fontWeight:700,zIndex:2000,boxShadow:"0 4px 20px #0008",
          whiteSpace:"nowrap"
        }}>{notif.msg}</div>
      )}

      {/* CONTENIDO */}
      <div style={{ padding:"16px", paddingBottom:80 }}>

        {tab==="dashboard" && (
          <>
            <Dashboard items={items} onNew={()=>setModalNuevo(true)} />
            {items.filter(i=>i.prioridad==="Alta"&&i.estado!=="Cerrado").length>0 && (
              <div>
                <div style={{ fontSize:12, color:COLORS.red, fontWeight:800, textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:8 }}>⚠️ Críticos</div>
                {items.filter(i=>i.prioridad==="Alta"&&i.estado!=="Cerrado").map(i=>(
                  <TarjetaPendiente key={i.id} item={i} onCerrar={id=>setModalCerrar(id)} onPosponer={id=>setModalPosponer(id)} onEditar={setModalEditar} />
                ))}
              </div>
            )}
          </>
        )}

        {tab==="lista" && (
          <>
            <div style={{ background:COLORS.surface, borderRadius:12, padding:"12px", marginBottom:14, border:`1px solid ${COLORS.border}` }}>
              <input
                value={search} onChange={e=>setSearch(e.target.value)}
                placeholder="🔍 Buscar por nombre o equipo…"
                style={{ width:"100%", background:COLORS.bg, border:`1px solid ${COLORS.border}`, borderRadius:8, padding:"9px 12px", color:COLORS.text, fontSize:13, boxSizing:"border-box", marginBottom:10, fontFamily:"inherit", outline:"none" }}
              />
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                <select value={filtroArea} onChange={e=>setFiltroArea(e.target.value)} style={{background:COLORS.bg,border:`1px solid ${COLORS.border}`,borderRadius:8,padding:"8px",color:COLORS.text,fontSize:12,fontFamily:"inherit"}}>
                  <option value="">Todas las áreas</option>{AREAS.map(a=><option key={a}>{a}</option>)}
                </select>
                <select value={filtroPrioridad} onChange={e=>setFiltroPrioridad(e.target.value)} style={{background:COLORS.bg,border:`1px solid ${COLORS.border}`,borderRadius:8,padding:"8px",color:COLORS.text,fontSize:12,fontFamily:"inherit"}}>
                  <option value="">Toda prioridad</option>{PRIORIDADES.map(a=><option key={a}>{a}</option>)}
                </select>
                <select value={filtroEstado} onChange={e=>setFiltroEstado(e.target.value)} style={{background:COLORS.bg,border:`1px solid ${COLORS.border}`,borderRadius:8,padding:"8px",color:COLORS.text,fontSize:12,fontFamily:"inherit"}}>
                  <option value="">Todo estado</option>{ESTADOS.map(a=><option key={a}>{a}</option>)}
                </select>
                <select value={filtroResp} onChange={e=>setFiltroResp(e.target.value)} style={{background:COLORS.bg,border:`1px solid ${COLORS.border}`,borderRadius:8,padding:"8px",color:COLORS.text,fontSize:12,fontFamily:"inherit"}}>
                  <option value="">Todos</option>{respList.map(a=><option key={a}>{a}</option>)}
                </select>
              </div>
            </div>
            <div style={{ fontSize:12, color:COLORS.textMuted, marginBottom:10 }}>{filtered.length} actividades encontradas</div>
            {filtered.length===0
              ? <div style={{ textAlign:"center", color:COLORS.textMuted, padding:40 }}>No hay pendientes con estos filtros</div>
              : filtered.map(i=>(
                <TarjetaPendiente key={i.id} item={i} onCerrar={id=>setModalCerrar(id)} onPosponer={id=>setModalPosponer(id)} onEditar={setModalEditar} />
              ))
            }
          </>
        )}

        {tab==="reportes" && <Reportes items={items} />}

      </div>

      {/* NAV */}
      <div style={{
        position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:480, background:COLORS.surface,
        borderTop:`1px solid ${COLORS.border}`, display:"flex",
        padding:"8px 0 12px", zIndex:200
      }}>
        {navTabs.map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} style={{
            flex:1, background:"none", border:"none", cursor:"pointer",

          }}>
            <span style={{ fontSize:22 }}>{t.icon}</span>

        <FormPendiente onSave={guardarNuevo} onCancel={()=>setModalNuevo(false)} />
      </Modal>
      <Modal open={!!modalEditar} onClose={()=>setModalEditar(null)} title="Editar Pendiente">
        <FormPendiente initial={modalEditar} onSave={guardarEditar} onCancel={()=>setModalEditar(null)} />
      </Modal>
      <Modal open={!!modalCerrar} onClose={()=>setModalCerrar(null)} title="Cerrar Actividad">
        <FormCierre onClose={c=>cerrarItem(modalCerrar,c)} onCancel={()=>setModalCerrar(null)} />
      </Modal>
      <Modal open={!!modalPosponer} onClose={()=>setModalPosponer(null)} title="Posponer Recordatorio">
        <FormPosponer onPosponer={ms=>posponerItem(modalPosponer,ms)} onCancel={()=>setModalPosponer(null)} />
      </Modal>
    </div>
  );
}

function Root() {
  const [auth, setAuth] = useState(() => sessionStorage.getItem("pendop_auth") === "1");
  const login = () => { sessionStorage.setItem("pendop_auth","1"); setAuth(true); };
  return auth ? <App /> : <LoginScreen onLogin={login} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
